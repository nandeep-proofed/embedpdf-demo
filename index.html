<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmbedPDF mark-up evaluation</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header {
        display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
        padding: 10px 16px; background: #1f2937; color: #fff;
      }
      header h1 { font-size: 15px; margin: 0 16px 0 0; font-weight: 600; }
      header label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
      header label[hidden] { display: none; }
      header input[type="text"] { padding: 4px 8px; border-radius: 4px; border: 1px solid #9ca3af; }
      header input[type="file"] { font-size: 13px; }
      header button {
        padding: 5px 10px; border-radius: 4px; border: 1px solid #9ca3af;
        background: #374151; color: #fff; cursor: pointer; font-size: 13px;
      }
      header button:disabled { opacity: 0.5; cursor: default; }
      header .divider { width: 1px; height: 22px; background: #6b7280; }
      #status { font-size: 12px; color: #d1d5db; margin-left: auto; }
      #pdf-viewer { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>EmbedPDF mark-up evaluation</h1>
      <!-- Author field hidden for now; ?author=Name in the URL still sets it. -->
      <label hidden>Author name <input id="author" type="text" value="Proofed" /></label>
      <label>Upload PDF <input id="file" type="file" accept="application/pdf" /></label>
      <button id="sample">Load sample PDF</button>
      <button id="download" disabled>Download annotated PDF</button>
      <span class="divider"></span>
      <button id="export" disabled>1. Export draft (JSON)</button>
      <button id="reload" disabled>2. Reload clean PDF</button>
      <button id="restore" disabled>3. Restore draft</button>
      <span id="status">No document loaded</span>
    </header>
    <div id="pdf-viewer"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
